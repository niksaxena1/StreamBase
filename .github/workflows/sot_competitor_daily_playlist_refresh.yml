name: SOT Competitor Daily Playlist Refresh

on:
  schedule:
    # 09:23 Dubai (GST, UTC+4) == 05:23 UTC
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (no clicking)"
        required: false
        type: boolean
        default: false
      limit:
        description: "Run only first N playlists (for testing)"
        required: false
        type: string

concurrency:
  group: sot-competitor-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Cache Playwright browsers
        id: playwright_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        timeout-minutes: 12
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Playwright's OS-dependency install shells out to apt, which can hang
          # indefinitely on a slow Ubuntu mirror (2026-08-19: 59 min stall on
          # archive.ubuntu.com consumed the whole job budget and lost a full
          # ingestion day). Bound each attempt and retry rather than stalling.
          install_browser() {
            if [ "${{ steps.playwright_cache.outputs.cache-hit }}" = "true" ]; then
              timeout 240 python -m playwright install-deps chromium
            else
              timeout 480 python -m playwright install --with-deps chromium
            fi
          }
          for attempt in 1 2 3; do
            if install_browser; then exit 0; fi
            echo "Playwright dependency install attempt $attempt failed or timed out; retrying..."
            sudo rm -rf /var/lib/apt/lists/* || true
            sleep 15
          done
          echo "Playwright dependency install failed after 3 attempts." >&2
          exit 1
      - name: Generate competitor config from database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # competitor.playlists is the source of truth (the /competitors "Add
        # competitor" form writes there); falls back to the committed CSV if
        # the database can't be read.
        run: python scripts/export_competitor_config_from_db.py
      - name: Write storage state from secret
        env:
          SOT_STORAGE_STATE_B64: ${{ secrets.SOT_STORAGE_STATE_B64 }}
        run: |
          if [ -z "$SOT_STORAGE_STATE_B64" ]; then exit 0; fi
          echo "$SOT_STORAGE_STATE_B64" | base64 --decode > sot_state.json
      - name: Refresh SpotOnTrack competitor playlists
        env:
          SOT_EMAIL: ${{ secrets.SOT_EMAIL }}
          SOT_PASSWORD: ${{ secrets.SOT_PASSWORD }}
        run: |
          ARGS="--headless"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python scripts/sot_refresh_playlists.py --config config/competitor_playlists.csv --storage-state sot_state.json $ARGS
      - name: Upload refresh logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sot-competitor-playlist-refresh-${{ github.run_id }}
          path: .artifacts/
          if-no-files-found: warn
          include-hidden-files: true
