name: Spotify artist image cache refresh

on:
  workflow_dispatch:
    inputs:
      max_refresh:
        description: "Max cached artists to refresh"
        required: false
        default: "5000"
      max_age_days:
        description: "Refresh cached rows older than N days"
        required: false
        default: "31"
  # Scheduled by the database (pg_cron -> ops.dispatch_workflow, migration 20261012220000):
  # GitHub's own cron started this 6-8 hours late. Dispatch failures email via ops.check_workflow_dispatches.

concurrency:
  group: spotify-artist-image-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      MAX_REFRESH: ${{ inputs.max_refresh || '5000' }}
      MAX_AGE_DAYS: ${{ inputs.max_age_days || '31' }}
    steps:
      - name: Gate scheduled runs to the first Friday
        id: schedule_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%-d)" -gt 7 ]; then
            echo "Not the first Friday of the month; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Setup Node
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        if: steps.schedule_gate.outputs.run == 'true'
        run: npm ci
        working-directory: web

      - name: Refresh cached artist images
        if: steps.schedule_gate.outputs.run == 'true'
        run: node scripts/refresh_spotify_artist_images.mjs
        working-directory: web

