name: Spotify Takedown Watch

# Own catalog only. Checks every catalog track against the Spotify Web API and
# emails when one is taken down (or comes back), ~2 days before SpotOnTrack
# data would show it. See scripts/check_spotify_track_availability.py.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check without writing to Supabase or emailing"
        required: false
        default: "false"
      track_id:
        description: "Diagnose a single Spotify track id instead of a full run (prints raw API signals)"
        required: false
        default: ""
      isrc:
        description: "Optional ISRC for the single-track diagnosis"
        required: false
        default: ""
      skip_safety_valve:
        description: "Record a mass takedown anyway (only after confirming it is real)"
        required: false
        default: "false"
  schedule:
    # 08:37 Dubai / 04:37 UTC daily: before the SpotOnTrack jobs, so the alert
    # is in the inbox at the start of the day.
    - cron: "37 4 * * *"

concurrency:
  group: spotify-takedown-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      STREAMBASE_REVALIDATE_URL: ${{ secrets.STREAMBASE_REVALIDATE_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      SPOTIFY_AVAILABILITY_MARKETS: ${{ vars.SPOTIFY_AVAILABILITY_MARKETS || 'US,GB,AE' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      TRACK_ID: ${{ inputs.track_id || '' }}
      ISRC: ${{ inputs.isrc || '' }}
      SKIP_SAFETY_VALVE: ${{ inputs.skip_safety_valve || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Spotify availability
        id: availability
        run: |
          args=()
          if [ -n "${TRACK_ID}" ]; then
            args+=(--track-id "${TRACK_ID}" --isrc "${ISRC}")
          else
            args+=(--email-output artifacts/spotify-takedown-email.json)
            [ "${DRY_RUN}" = "true" ] && args+=(--dry-run)
            [ "${SKIP_SAFETY_VALVE}" = "true" ] && args+=(--skip-safety-valve)
          fi
          python scripts/check_spotify_track_availability.py "${args[@]}"

      - name: Send takedown and restoration alerts
        if: steps.availability.outputs.alert != ''
        uses: ./.github/actions/notify-email
        with:
          password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}
          subject: ${{ fromJSON(steps.availability.outputs.alert).subject }}
          body: ${{ fromJSON(steps.availability.outputs.alert).body }}
          html_body: ${{ fromJSON(steps.availability.outputs.alert).html_body }}

      - name: Mark delivered alerts as notified
        if: steps.availability.outputs.alert != ''
        run: python scripts/check_spotify_track_availability.py --ack-notifications artifacts/spotify-takedown-email.json

      - name: Upload alert audit
        if: always() && steps.availability.outputs.alert != ''
        uses: actions/upload-artifact@v7
        with:
          name: spotify-takedown-alert
          path: artifacts/spotify-takedown-email.json
          retention-days: 7

      - name: Send failure notification
        if: failure()
        uses: ./.github/actions/notify-email
        with:
          password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}
          subject: "[StreamBase] Spotify Takedown Watch FAILED"
          body: |
            The Spotify Takedown Watch workflow failed, so takedowns may go unnoticed until it is fixed.
            A deliberate stop (mass-takedown or "no usable answer" safety valve) also lands here; the run summary says which.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
