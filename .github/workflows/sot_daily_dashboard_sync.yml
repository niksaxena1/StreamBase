name: SOT Daily Dashboard Sync

permissions:
  actions: read
  contents: read

on:
  workflow_run:
    workflows: ["SOT Daily Playlist Refresh"]
    types: [completed]
  schedule:
    # Fallback if the refresh chain is missed; skip if already synced today.
    - cron: "11 6 * * *"
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Force a full dashboard sync (also automatic on Sundays UTC)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Preview only (no clicking)"
        required: false
        type: boolean
        default: false
      add_only:
        description: "Add-only mode (never remove from dashboards)"
        required: false
        type: boolean
        default: false
      limit:
        description: "Run only first N tasks (for testing)"
        required: false
        type: string

concurrency:
  group: sot-own-dashboard-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Wait for SpotOnTrack to process playlist refresh
        if: github.event_name == 'workflow_run'
        run: sleep 600

      - uses: actions/checkout@v4

      - name: "Pre-check: skip if already synced successfully today"
        id: precheck
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The fallback cron exists for redundancy; skip the second full sync
          # when the first already succeeded today.
          SHOULD_RUN="true"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TODAY=$(date -u +'%Y-%m-%d')
            RUNS_ENDPOINT="repos/${GITHUB_REPOSITORY}/actions/workflows/sot_daily_dashboard_sync.yml/runs?branch=main&per_page=50"
            OK="$(gh api "$RUNS_ENDPOINT" --jq '.workflow_runs | any(.[]; (.created_at | startswith("'"$TODAY"'")) and .status=="completed" and .conclusion=="success")' || true)"
            if [ "$OK" = "true" ]; then SHOULD_RUN="false"; echo "Already synced successfully today; skipping."; fi
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.precheck.outputs.should_run == 'true'
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Playwright browsers
        if: steps.precheck.outputs.should_run == 'true'
        id: playwright_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        if: steps.precheck.outputs.should_run == 'true'
        timeout-minutes: 12
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Playwright's OS-dependency install shells out to apt, which can hang
          # indefinitely on a slow Ubuntu mirror (2026-08-19: 59 min stall on
          # archive.ubuntu.com consumed the whole job budget and lost a full
          # ingestion day). Bound each attempt and retry rather than stalling.
          install_browser() {
            if [ "${{ steps.playwright_cache.outputs.cache-hit }}" = "true" ]; then
              timeout 240 python -m playwright install-deps chromium
            else
              timeout 480 python -m playwright install --with-deps chromium
            fi
          }
          for attempt in 1 2 3; do
            if install_browser; then exit 0; fi
            echo "Playwright dependency install attempt $attempt failed or timed out; retrying..."
            sudo rm -rf /var/lib/apt/lists/* || true
            sleep 15
          done
          echo "Playwright dependency install failed after 3 attempts." >&2
          exit 1

      - name: Write storage state from secret
        if: steps.precheck.outputs.should_run == 'true'
        env:
          SOT_STORAGE_STATE_B64: ${{ secrets.SOT_STORAGE_STATE_B64 }}
        run: |
          if [ -z "$SOT_STORAGE_STATE_B64" ]; then
            echo "SOT_STORAGE_STATE_B64 not set (ok). Will rely on login fallback if configured."
            exit 0
          fi
          echo "$SOT_STORAGE_STATE_B64" | base64 --decode > sot_state.json

      - name: Restore dashboard sync state
        if: steps.precheck.outputs.should_run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .sync-state/own.json
          key: sot-sync-state-own-${{ github.run_id }}
          restore-keys: sot-sync-state-own-

      - name: Sync dashboards to playlists
        if: steps.precheck.outputs.should_run == 'true'
        env:
          SOT_EMAIL: ${{ secrets.SOT_EMAIL }}
          SOT_PASSWORD: ${{ secrets.SOT_PASSWORD }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS="--headless"
          if [ "$(date -u +%u)" = "7" ] || [ "${{ inputs.full_sync }}" = "true" ]; then ARGS="$ARGS --full"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.add_only }}" = "true" ]; then ARGS="$ARGS --no-sync"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python scripts/sot_sync_dashboards.py --config config/playlists.csv --storage-state sot_state.json --state-file .sync-state/own.json $ARGS

      - name: Save dashboard sync state (including partial progress)
        if: always() && steps.precheck.outputs.should_run == 'true'
        uses: actions/cache/save@v4
        with:
          path: .sync-state/own.json
          key: sot-sync-state-own-${{ github.run_id }}

      - name: Upload sync log artifact
        if: always() && steps.precheck.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sot-dashboard-sync-${{ github.run_id }}
          path: .artifacts/
          if-no-files-found: warn

      - name: Check sync results for notification
        id: notify_check
        if: always() && steps.precheck.outputs.should_run == 'true'
        shell: bash
        run: |
          SHOULD_NOTIFY="false"
          SUBJECT="[StreamBase] Dashboard Sync: unknown issue"
          SKIPPED="?"
          ERRORS="?"
          TOTAL="?"
          ADDED="?"
          REMOVED="?"

          if [ -f ".artifacts/sync_summary.json" ]; then
            SUMMARY=$(cat .artifacts/sync_summary.json)
            SKIPPED=$(echo "$SUMMARY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('total_skipped',0))")
            ERRORS=$(echo "$SUMMARY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('total_errors',0))")
            TOTAL=$(echo "$SUMMARY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('tasks_total',0))")
            ADDED=$(echo "$SUMMARY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('total_added',0))")
            REMOVED=$(echo "$SUMMARY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('total_removed',0))")

            if [ "$SKIPPED" -gt 0 ] || [ "$ERRORS" -gt 0 ]; then
              SHOULD_NOTIFY="true"
              SUBJECT="[StreamBase] Dashboard Sync: ${SKIPPED} skipped, ${ERRORS} errors"
            fi
          fi

          # Always notify on hard failure (even without summary).
          if [ "${{ job.status }}" = "failure" ]; then
            SHOULD_NOTIFY="true"
            SUBJECT="[StreamBase] Dashboard Sync FAILED"
          fi

          echo "should_notify=$SHOULD_NOTIFY" >> "$GITHUB_OUTPUT"
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<ENDOFBODY'
            if [ -f ".artifacts/sync_summary.json" ]; then
              echo "Dashboard Sync results:"
              echo "  Tasks: ${TOTAL}"
              echo "  Skipped: ${SKIPPED} (0-track scans or safety blocks)"
              echo "  Errors: ${ERRORS}"
              echo "  Added: ${ADDED}"
              echo "  Removed: ${REMOVED}"
            else
              echo "No sync summary available (script may not have completed)."
            fi
            echo ""
            echo "Skipped tasks may have debug screenshots in the workflow artifacts."
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo 'ENDOFBODY'
          } >> "$GITHUB_OUTPUT"

      - name: Send notification email
        if: always() && steps.notify_check.outputs.should_notify == 'true'
        uses: ./.github/actions/notify-email
        with:
          password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}
          subject: ${{ steps.notify_check.outputs.subject }}
          body: ${{ steps.notify_check.outputs.body }}
