# R2 archive tier for old stream history (Parquet in Cloudflare R2, read back through the Postgres S3 FDW).
# - monthly archive run (days 4): archives months that fell out of the packed-months policy (nothing is due yet);
# - monthly self-test (day 5): archives a COPY of the earliest compact month, verifies it through the FDW, removes nothing;
# Failures email through ops.pipeline_alerts. Success sends nothing.
name: Stream Archive (R2)

permissions:
  contents: read

on:
  schedule:
    - cron: "10 3 4 * *"
    - cron: "10 3 5 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke | selftest | archive"
        required: true
        default: selftest
        type: choice
        options:
          - smoke
          - selftest
          - archive

concurrency:
  group: stream-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-input pyarrow boto3 requests

      - name: Pick mode
        id: mode
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "$(date -u +%d)" = "04" ]; then MODE="archive"; else MODE="selftest"; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python archive_stream_months.py "${{ steps.mode.outputs.mode }}"
