name: Playlist Watch Track Streams Daily

# Daily play counts for every track of playlist_watch.track_watch_playlists (first: "upload").
# Separate from the follower watch and from all own-catalog/competitor jobs.
# Scheduled by the database (pg_cron 'streambase-playlist-watch-tracks' -> ops.dispatch_workflow,
# migration 20261104174153), 14:20 UTC.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch without writing to Supabase"
        required: false
        default: "false"

concurrency:
  group: playlist-watch-track-streams-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      PLAYCOUNT_QUERY_HASH: ${{ vars.PLAYCOUNT_QUERY_HASH }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect track play counts
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            python scripts/collect_playlist_watch_track_streams.py --dry-run
          else
            python scripts/collect_playlist_watch_track_streams.py
          fi

      - name: Send failure notification
        if: failure()
        uses: ./.github/actions/notify-email
        with:
          password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}
          subject: "[StreamBase] Playlist Watch track streams FAILED"
          body: |
            The Playlist Watch track-streams workflow (upload playlist play counts) failed.
            If every play-count call failed, Spotify probably rotated the getTrack query hash:
            set the repo variable PLAYCOUNT_QUERY_HASH (see docs/PLAYLIST-WATCH-OPERATIONS.md).

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
