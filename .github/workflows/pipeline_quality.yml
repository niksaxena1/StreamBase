name: Pipeline quality

on:
  pull_request:
    paths:
      - "scripts/**"
      - "config/**"
      - "requirements*.txt"
      - ".github/**"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - "requirements*.txt"
      - ".github/**"

concurrency:
  group: pipeline-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest scripts/tests -q

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint v1.7.7
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "${RUNNER_TEMP}/actionlint.tar.gz"
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
      - name: Lint all workflows
        run: '"$RUNNER_TEMP/actionlint" -shellcheck='
