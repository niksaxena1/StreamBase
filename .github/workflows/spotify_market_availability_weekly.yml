name: Spotify Territory Availability (daily)

# Own catalog only. Checks every catalog track against the Spotify Web API in
# each territory and records where it is NOT playable; emails when a track newly
# loses territories. Tracks the takedown watch marks unavailable are skipped.
# (The file name still says "weekly" because pg_cron dispatches it by name.)
# See scripts/scan_spotify_market_availability.py.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scan without writing to Supabase or emailing"
        required: false
        default: "false"
      artist:
        description: "Optional artist name to scan only that artist's tracks"
        required: false
        default: ""
      skip_safety_valve:
        description: "Write even if a safety valve trips (only after confirming the changes are real)"
        required: false
        default: "false"
  # Scheduled daily by the database (pg_cron -> ops.dispatch_workflow, job
  # streambase-market-availability, 21:00 UTC; created by
  # 20261106233500_add_spotify_market_availability.sql, made daily by
  # 20261107090000_reschedule_market_availability_daily.sql). No GitHub `schedule:` trigger.
  # Dispatch failures email via ops.check_workflow_dispatches.

concurrency:
  group: spotify-market-availability
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      STREAMBASE_REVALIDATE_URL: ${{ secrets.STREAMBASE_REVALIDATE_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      ARTIST: ${{ inputs.artist || '' }}
      SKIP_SAFETY_VALVE: ${{ inputs.skip_safety_valve || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scan Spotify territories
        id: scan
        run: |
          mkdir -p artifacts
          args=(--report-csv artifacts/spotify-market-availability.csv --email-output artifacts/spotify-market-email.json)
          [ -n "${ARTIST}" ] && args+=(--artist "${ARTIST}")
          [ "${DRY_RUN}" = "true" ] && args+=(--dry-run)
          [ "${SKIP_SAFETY_VALVE}" = "true" ] && args+=(--skip-safety-valve)
          python scripts/scan_spotify_market_availability.py "${args[@]}"

      - name: Upload territory report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotify-market-availability-report
          path: artifacts/spotify-market-availability.csv
          if-no-files-found: ignore
          retention-days: 30

      - name: Send territory-loss alerts
        if: steps.scan.outputs.alert != ''
        uses: ./.github/actions/notify-email
        with:
          password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}
          subject: ${{ fromJSON(steps.scan.outputs.alert).subject }}
          body: ${{ fromJSON(steps.scan.outputs.alert).body }}
          html_body: ${{ fromJSON(steps.scan.outputs.alert).html_body }}

      - name: Mark delivered alerts as notified
        if: steps.scan.outputs.alert != ''
        run: python scripts/scan_spotify_market_availability.py --ack-notifications artifacts/spotify-market-email.json

      - name: Upload alert audit
        if: always() && steps.scan.outputs.alert != ''
        uses: actions/upload-artifact@v7
        with:
          name: spotify-market-alert
          path: artifacts/spotify-market-email.json
          retention-days: 7

      - name: Send failure notification
        if: failure()
        uses: ./.github/actions/notify-email
        with:
          password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}
          subject: "[StreamBase] Spotify Territory Availability scan FAILED"
          body: |
            The daily Spotify territory availability scan failed, so per-territory restrictions may go unnoticed until it is fixed.
            A deliberate stop (missing-data or mass-loss safety valve) also lands here; the run summary says which.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
