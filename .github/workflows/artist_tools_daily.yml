name: Artist Tools Daily

permissions:
  contents: read

on:
  # Scheduled by the database (pg_cron -> ops.dispatch_workflow, migration 20261012220000):
  # GitHub's own cron started this 6-8 hours late. Dispatch failures email via ops.check_workflow_dispatches.
  workflow_dispatch:
    inputs:
      date:
        description: UTC observation date (blank = today; historical counts unavailable)
        required: false
        type: string
      max_adds:
        description: Maximum folder additions (0 to 250)
        required: false
        type: string
        default: "240"

concurrency:
  group: artist-tools-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Record counts and run fallback repair
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_MAX_ADDS: ${{ inputs.max_adds }}
        shell: bash
        run: |
          args=(run --runner github --skip-if-done --max-adds "${INPUT_MAX_ADDS:-240}")
          if [ -n "$INPUT_DATE" ]; then args+=(--date "$INPUT_DATE"); fi
          python -u scripts/artist_tools_daily.py "${args[@]}"
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: artist-tools-summary
          path: .artifacts/artist_tools_summary.json
          include-hidden-files: true
          if-no-files-found: warn
